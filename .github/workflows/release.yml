name: Release

# Builds a .dmg and publishes it as a GitHub Release whenever a version
# tag like v1.0.0 is pushed.
"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build DMGs
        env:
          # Strip the leading "v" from e.g. "v1.0.0" -> "1.0.0".
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          ./Scripts/build_dmg.sh "$VERSION" arm64
          ./Scripts/build_dmg.sh "$VERSION" x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucid-dmg
          path: build/Lucid-*.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/Lucid-*.dmg \
            --title "Lucid ${{ github.ref_name }}" \
            --generate-notes
